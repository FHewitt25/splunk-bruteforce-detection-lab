# C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Collect the Windows Security log from the monitored endpoint.
[WinEventLog://Security]
disabled = 0
start_from = oldest
current_only = 0
evt_resolve_ad_obj = 1
checkpointInterval = 5
# 4625 = failed logon, 4740 = account locked out
whitelist = 4625,4740
