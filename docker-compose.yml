# Splunk Enterprise SIEM (single container)
# Password is read from a local .env file. Never commit .env.
services:
  splunk:
    image: splunk/splunk:latest
    container_name: splunk_siem
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
    ports:
      - "8000:8000"   # Splunk Web UI
      - "8089:8089"   # Management / REST API
      - "9997:9997"   # Receiving port for the Universal Forwarder
    volumes:
      - splunk_etc:/opt/splunk/etc
      - splunk_var:/opt/splunk/var
    restart: unless-stopped

volumes:
  splunk_etc:
  splunk_var:
